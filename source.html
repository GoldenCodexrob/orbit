<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBIT — Código Fuente</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #020617;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 1.5rem;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 30% 20%, rgba(34,211,238,0.07) 0%, transparent 70%),
                radial-gradient(ellipse 50% 40% at 70% 80%, rgba(99,102,241,0.07) 0%, transparent 70%);
            pointer-events: none;
        }
        .card {
            position: relative;
            width: 100%;
            max-width: 420px;
            background: rgba(15,23,42,0.95);
            border: 1px solid rgba(34,211,238,0.2);
            border-radius: 1.5rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 0 60px rgba(34,211,238,0.06), 0 25px 50px rgba(0,0,0,0.5);
            text-align: center;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #22d3ee, #6366f1, transparent);
            border-radius: 1.5rem 1.5rem 0 0;
        }
        .lock-icon {
            width: 64px; height: 64px;
            border-radius: 1rem;
            background: linear-gradient(135deg, rgba(34,211,238,0.15), rgba(99,102,241,0.15));
            border: 1px solid rgba(34,211,238,0.25);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 1.5rem; color: #22d3ee;
        }
        .label-top { font-size:.7rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:#22d3ee; margin-bottom:.5rem; }
        h1 { font-size:1.5rem; font-weight:800; color:#f1f5f9; margin-bottom:.4rem; }
        .subtitle { font-size:.85rem; color:#64748b; margin-bottom:2rem; line-height:1.5; }
        .input-wrap { position:relative; margin-bottom:1rem; }
        input[type="password"], input[type="text"] {
            width: 100%;
            padding: .85rem 3rem .85rem 1rem;
            background: rgba(30,41,59,0.8);
            border: 1px solid rgba(51,65,85,0.8);
            border-radius: .75rem;
            color: #f1f5f9;
            font-size: 1.05rem;
            letter-spacing: .15em;
            outline: none;
            transition: border-color .2s;
            text-align: center;
        }
        input:focus { border-color: rgba(34,211,238,0.5); box-shadow: 0 0 0 3px rgba(34,211,238,0.08); }
        .toggle-pw { position:absolute; right:.85rem; top:50%; transform:translateY(-50%); background:none; border:none; color:#475569; cursor:pointer; font-size:.95rem; padding:.2rem; }
        .toggle-pw:hover { color:#94a3b8; }
        .btn { width:100%; padding:.9rem; background:linear-gradient(135deg,#0ea5e9,#22d3ee); color:#020617; font-weight:800; font-size:.95rem; border:none; border-radius:.75rem; cursor:pointer; transition:opacity .2s,transform .15s; letter-spacing:.02em; }
        .btn:hover { opacity:.9; transform:translateY(-1px); }
        .btn:active { transform:translateY(0); }
        .error-msg { display:none; margin-top:.75rem; font-size:.8rem; color:#f87171; font-weight:600; }
        .back-link { display:inline-flex; align-items:center; gap:.4rem; margin-top:1.75rem; font-size:.78rem; color:#334155; text-decoration:none; transition:color .2s; }
        .back-link:hover { color:#64748b; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }
        .shake { animation: shake .4s ease; }
    </style>
</head>
<body>
<div class="card" id="card">
    <div class="lock-icon"><i class="fa-solid fa-code"></i></div>
    <p class="label-top">Golden Codex &middot; ORBIT</p>
    <h1>C&oacute;digo Fuente</h1>
    <p class="subtitle">Acceso restringido.<br>Ingresa la contrase&ntilde;a para continuar.</p>
    <div class="input-wrap">
        <input type="password" id="pw" placeholder="Contrase&ntilde;a" autofocus onkeydown="if(event.key==='Enter') unlock()">
        <button class="toggle-pw" onclick="togglePw()" tabindex="-1"><i class="fa-regular fa-eye" id="eye-icon"></i></button>
    </div>
    <button class="btn" onclick="unlock()">
        <i class="fa-solid fa-unlock-keyhole" style="margin-right:.4rem;"></i>Acceder
    </button>
    <p class="error-msg" id="err">Contrase&ntilde;a incorrecta. Intenta de nuevo.</p>
    <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left" style="font-size:.7rem;"></i> Volver al sitio</a>
</div>
<script>
    function unlock() {
        if (document.getElementById('pw').value === '50025002') {
            window.location.href = 'index2.html';
        } else {
            document.getElementById('err').style.display = 'block';
            var card = document.getElementById('card');
            card.classList.remove('shake');
            void card.offsetWidth;
            card.classList.add('shake');
            document.getElementById('pw').value = '';
            document.getElementById('pw').focus();
        }
    }
    function togglePw() {
        var pw = document.getElementById('pw');
        var icon = document.getElementById('eye-icon');
        if (pw.type === 'password') { pw.type = 'text'; icon.className = 'fa-regular fa-eye-slash'; }
        else { pw.type = 'password'; icon.className = 'fa-regular fa-eye'; }
    }
</script>
</body>
</html>
