<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion - ORBIT Golden Codex</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-blue-400 selection:text-slate-950">
    <nav class="bg-slate-950/90 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="index.html" class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-700 via-blue-500 to-cyan-400 flex items-center justify-center font-black text-white shadow-lg shadow-blue-600/20">G</div>
                    <span class="font-extrabold text-xl tracking-wider text-white">GOLDEN CODEX</span>
                </a>
                <a href="index.html" class="text-slate-400 hover:text-cyan-400 text-sm font-medium transition-colors"><i class="fa-solid fa-arrow-left mr-1"></i> Back to Home</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-4 py-12">
        <div class="w-full max-w-md bg-slate-900/60 border border-slate-800 rounded-3xl p-8 sm:p-10 shadow-2xl backdrop-blur-sm relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-blue-700 via-blue-400 to-cyan-400"></div>
            <div class="text-center mb-8">
                <span class="text-blue-400 font-bold uppercase tracking-widest text-xs block mb-2">Welcome back</span>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-white">Log In</h1>
                <p class="text-slate-400 text-xs mt-2">Accede a tu cuenta vinculada al sistema ORBIT &middot; Access your ORBIT account</p>
            </div>
            <div id="auth-message" class="hidden p-3 rounded-xl text-center text-xs font-semibold mb-4 border"></div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Email</label>
                    <input type="email" id="email" required placeholder="correo@ejemplo.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-cyan-400 transition-colors text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Password</label>
                    <input type="password" id="password" required placeholder="..........." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-cyan-400 transition-colors text-sm">
                </div>
                <div class="pt-2">
                    <button type="submit" id="submit-btn" class="w-full py-3.5 px-6 rounded-xl bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-bold transition-all shadow-lg shadow-cyan-400/20 flex items-center justify-center gap-2 text-sm">
                        <span>Log In</span>
                    </button>
                </div>
            </form>
            <div class="mt-6 text-center text-xs text-slate-400">&iquest;No tienes una cuenta? / No account? <a href="register.html" class="text-cyan-400 font-bold hover:underline">Register free</a></div>
        </div>
    </main>

    <footer class="bg-slate-950 border-t border-slate-900 py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 Golden Codex Team. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
